<body class="admin-page">
<header class="admin-header">
  <div class="container admin-header__inner">
    <div>
      <a class="brand" href="index.html" aria-label="الرجوع للمتجر">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="16" cy="16" r="3"/><ellipse cx="16" cy="7" rx="3" ry="5"/><ellipse cx="16" cy="25" rx="3" ry="5"/><ellipse cx="7" cy="16" rx="5" ry="3"/><ellipse cx="25" cy="16" rx="5" ry="3"/></g></svg>

<main class="admin-main">
  <section class="container admin-panel">
    <div class="admin-toolbar">
      <div>
        <h1>لوحة الأدمن</h1>

      <div class="admin-toolbar__actions">
        <button class="admin-save" id="saveAllPrices" type="button">حفظ كل الأسعار</button>
        <button class="admin-save" id="downloadJson" type="button">تحميل products.json</button>
        <button class="admin-danger" id="resetAll" type="button">مسح كل التعديلات</button>
      </div>
    </div>

    <p class="admin-note" id="status" role="status">السعر يتحفظ تلقائيًا على جهازك. بعد الانتهاء حمّلي products.json وارفعيه على الاستضافة.</p>
    <div class="admin-grid" id="adminGrid"></div>
  </section>

<script src="sokarty-control-7xq29.js"></script>
